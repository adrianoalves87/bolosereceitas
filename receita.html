<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receita | Bolos e Receitas</title>

<meta name="description" content="Receita completa passo a passo.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://bolosereceitas.com">

<link rel="stylesheet" href="./style.css">
</head>

<body>

<header>
<div class="logo">Bolos e Receitas</div>
<nav>
<a href="index.html">Voltar</a>
</nav>
</header>

<main>
<div id="receitaContainer"></div>
</main>

<script>

fetch("./receitas.json")
.then(r => r.json())
.then(receitas => {

  const id = new URLSearchParams(location.search).get("id");

  const receita = receitas.find(r => r.id === id);

  if (!receita) {
    document.getElementById("receitaContainer").innerHTML =
      "<h1>Receita não encontrada</h1>";
    return;
  }

  // SEO dinâmico
  document.title = `${receita.nome} | Bolos e Receitas`;
  document.querySelector('meta[name="description"]')
    .setAttribute("content", receita.descricao);

  document.getElementById("receitaContainer").innerHTML = `
    <article class="receita">

      <img src="${receita.imagem}" alt="${receita.nome}">

      <h1>${receita.nome}</h1>

      <p>${receita.descricao}</p>

      <div>
        ${receita.receita}
      </div>

    </article>
  `;

});

</script>

</body>
</html>
