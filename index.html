<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bolos e Receitas | Receitas fáceis e caseiras</title>

<meta name="description" content="Receitas fáceis de bolos, sobremesas e doces caseiros. Aprenda passo a passo.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://bolosereceitas.com">

<!-- OPEN GRAPH -->
<meta property="og:title" content="Bolos e Receitas">
<meta property="og:description" content="Receitas fáceis de bolos e sobremesas caseiras.">
<meta property="og:type" content="website">

<!-- CSS -->
<link rel="stylesheet" href="./style.css">

</head>

<body>

<header>
<div class="logo">Bolos e Receitas</div>

<nav>
<a href="#inicio">Início</a>
<a href="#bolos">Bolos</a>
<a href="#sobremesas">Sobremesas</a>
</nav>
</header>

<main>

<section class="hero" id="inicio">
<h1>As melhores receitas caseiras 🍰</h1>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Buscar receita...">
<button id="searchBtn">Buscar</button>
</div>
</section>

<section id="bolos" class="section">
<h2>Bolos</h2>
<div id="bolosContainer"></div>
</section>

<section id="sobremesas" class="section">
<h2>Sobremesas</h2>
<div id="sobremesasContainer"></div>
</section>

</main>

<footer>
<p>© 2026 Bolos e Receitas</p>
</footer>

<script>

let receitas = [];

const bolosContainer = document.getElementById("bolosContainer");
const sobremesasContainer = document.getElementById("sobremesasContainer");
const searchInput = document.getElementById("searchInput");

fetch("./receitas.json")
.then(r => r.json())
.then(data => {
  receitas = data;
  render();
});

function render() {
  bolosContainer.innerHTML = "";
  sobremesasContainer.innerHTML = "";

  receitas.forEach(item => {

    const card = `
      <div class="card" data-name="${item.nome.toLowerCase()}">
        <img src="${item.imagem}" alt="${item.nome}">
        <h3>${item.nome}</h3>
        <p>${item.descricao}</p>
        <a href="receita.html?id=${item.id}">Ver receita</a>
      </div>
    `;

    if (item.categoria === "bolos") {
      bolosContainer.innerHTML += card;
    } else {
      sobremesasContainer.innerHTML += card;
    }

  });
}

function buscar() {
  const value = searchInput.value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {
    const name = card.dataset.name;

    if (name.includes(value)) {
      card.scrollIntoView({ behavior: "smooth" });
      card.style.border = "2px solid orange";
      setTimeout(() => card.style.border = "none", 2000);
    }
  });
}

document.getElementById("searchBtn").onclick = buscar;

</script>

</body>
</html>
